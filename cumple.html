<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  color: white;
  background: black;
}

/* 🌌 ESTRELLAS */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
  from {opacity:0.2;}
  to {opacity:1;}
}

/* INTRO */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 5em;
  z-index: 100;
}

/* CONTENIDO */
#contenido {
  display: none;
  text-align: center;
  padding-top: 20px;
}

/* 🏎️ CARRO REAL */
#carro {
  position: absolute;
  bottom: 120px;
  left: -150px;
  animation: manejar 6s linear infinite;
}

@keyframes manejar {
  0% { left: -150px; }
  100% { left: 110%; }
}

.car {
  width: 120px;
  height: 40px;
  position: relative;
}

.body {
  width: 100%;
  height: 18px;
  background: linear-gradient(90deg, red, darkred);
  position: absolute;
  top: 12px;
  border-radius: 8px;
}

.cabin {
  width: 30px;
  height: 15px;
  background: black;
  position: absolute;
  top: 0;
  left: 45px;
  border-radius: 4px;
}

.wheel {
  width: 20px;
  height: 20px;
  background: black;
  border-radius: 50%;
  position: absolute;
  bottom: 0;
  animation: spin 0.2s linear infinite;
}

.front { right: 5px; }
.back { left: 5px; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 🕺🏾 BAILARÍN */
.dancer {
  font-size: 60px;
  margin-top: 20px;
  animation: bailar 0.8s infinite alternate;
}
@keyframes bailar {
  from { transform: rotate(-10deg); }
  to { transform: rotate(10deg); }
}

/* ✉️ SOBRE */
.envelope {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 140px;
  background: #ff4d6d;
  border-radius: 8px;
  cursor: pointer;
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff758c;
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  transform-origin: top;
  transition: 0.6s;
}

.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 90%;
  max-width: 400px;
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  transform: translate(-50%, 100%);
  transition: 0.6s;
  z-index: 20;
}

.envelope.open .flap {
  transform: rotateX(180deg);
}

.envelope.open + .letter {
  transform: translate(-50%, -50%);
}

/* 🎉 CONFETI EXPLOSIÓN */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  top: 50%;
  left: 50%;
  animation: explotar 1s ease-out forwards;
}

@keyframes explotar {
  to {
    transform: translate(var(--x), var(--y)) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">3</div>

<!-- CONTENIDO -->
<div id="contenido">

<h1>🏁 ¡Feliz Cumpleaños, CAMBIA_NOMBRE! 🏁</h1>

<p>🏎️ Vas en tu <strong>vuelta 23</strong>… ¡la carrera apenas comienza!</p>

<div id="carro">
  <div class="car">
    <div class="body"></div>
    <div class="cabin"></div>
    <div class="wheel front"></div>
    <div class="wheel back"></div>
  </div>
</div>

<div class="dancer">🕺🏾</div>

<!-- SOBRE -->
<div class="envelope" id="envelope">
  <div class="flap"></div>
</div>

<div class="letter">
  <h2>💌 Para ti</h2>
  <p>
    Espero que cumplas todos tus sueños,  
    que seas muy feliz y siempre te sientas amado 💙  
    Sigue avanzando, vas increíble 🚀
  </p>
</div>

<!-- 🎵 ESPACIO PARA TU MÚSICA -->
<audio id="musica" controls>
  <source src="AQUI_PONES_TU_MP3.mp3" type="audio/mpeg">
</audio>

</div>

<script>
// estrellas
for(let i=0;i<120;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*window.innerWidth+"px";
  s.style.top=Math.random()*window.innerHeight+"px";
  s.style.animationDuration=(Math.random()*2+1)+"s";
  document.body.appendChild(s);
}

// cuenta regresiva
let num=3;
let intro=document.getElementById("intro");

let cuenta=setInterval(()=>{
  num--;
  if(num>0){
    intro.innerText=num;
  } else {
    intro.innerText="🎉";
    setTimeout(()=>{
      intro.style.display="none";
      document.getElementById("contenido").style.display="block";
    },1000);
    clearInterval(cuenta);
  }
},1000);

// carta + confeti explosión
document.getElementById("envelope").onclick=function(){
  this.classList.toggle("open");

  for(let i=0;i<120;i++){
    let c=document.createElement("div");
    c.className="confetti";

    let x=(Math.random()-0.5)*600+"px";
    let y=(Math.random()-0.5)*600+"px";

    c.style.setProperty("--x",x);
    c.style.setProperty("--y",y);

    c.style.background=["red","yellow","blue","green","pink"][Math.floor(Math.random()*5)];

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),1000);
  }
};
</script>

</body>
</html>
